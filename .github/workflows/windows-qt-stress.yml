name: Windows Qt Stress

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"

permissions:
  contents: read

env:
  BUILD_DIR: build-windows-stress
  QT_VERSION: 6.8.3
  QT_ARCH: win64_msvc2022_64

jobs:
  stress-test:
    name: Build and run non-hardware stress tests on Windows
    runs-on: windows-2022

    steps:
      - name: Check out repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Qt
        # jurplel/install-qt-action v4.3.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtserialport
          cache: true

      - name: Configure stress tests
        shell: pwsh
        run: cmake -S . -B $env:BUILD_DIR -G "Visual Studio 17 2022" -A x64 -DSVM_ENABLE_STRESS_TESTS=ON

      - name: Build stress tests
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --target quality_stress_tests --parallel 1

      - name: Run stress tests with timing
        shell: pwsh
        run: |
          $duration = Measure-Command {
            ctest --test-dir $env:BUILD_DIR --output-on-failure -C Release -L stress
          }
          "Windows stress duration seconds: {0:N2}" -f $duration.TotalSeconds
