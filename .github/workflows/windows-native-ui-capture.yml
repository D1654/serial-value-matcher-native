name: Windows Native UI Capture

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/windows-native-ui-capture.yml"
      - "scripts/capture-windows-native-ui.ps1"
      - "scripts/run-windows-native-serial-pty-loopback.py"
      - "src/win32/**"
      - "src/transport/**"
      - "src/core/**"
      - "src/native_storage/**"
      - "tests/**"
      - "CMakeLists.txt"

permissions:
  contents: read

env:
  BUILD_DIR: build-windows-native-ui
  UI_ARTIFACT_DIR: artifacts/windows-native-ui
  EVIDENCE_GITHUB_SHA: ${{ github.sha }}
  EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  capture-ui:
    name: Capture Win32 native UI on Windows
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Configure native-only
        shell: pwsh
        run: >
          cmake -S . -B $env:BUILD_DIR
          -G "Visual Studio 17 2022"
          -A x64
          -DSVM_BUILD_WIN32_APP=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --parallel 1

      - name: Run native tests
        shell: pwsh
        run: ctest --test-dir $env:BUILD_DIR --output-on-failure -C Release --no-tests=error

      - name: Run native UI performance gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:UI_ARTIFACT_DIR -Force | Out-Null
          $env:SVM_NATIVE_SELF_TEST_LOG = Join-Path $env:UI_ARTIFACT_DIR "ui-perf-test.log"
          & (Join-Path $env:BUILD_DIR "Release\svm-native-win32.exe") --ui-perf-test

      - name: Capture native UI screenshots
        shell: pwsh
        run: >
          .\scripts\capture-windows-native-ui.ps1
          -BuildDir $env:BUILD_DIR
          -Config Release
          -OutputDir $env:UI_ARTIFACT_DIR
          -SkipUiPerfTest

      - name: Bind UI evidence to workflow revision
        shell: pwsh
        run: |
          $checkedOutSha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve the checked-out commit SHA."
          }
          $shaPattern = "^[0-9a-fA-F]{40}$"
          foreach ($value in @(
            @{ Label = "GitHubSha"; Sha = $env:EVIDENCE_GITHUB_SHA },
            @{ Label = "GitHubHeadSha"; Sha = $env:EVIDENCE_HEAD_SHA },
            @{ Label = "CheckedOutSha"; Sha = $checkedOutSha }
          )) {
            if ($value.Sha -notmatch $shaPattern) {
              throw "Invalid $($value.Label): $($value.Sha)"
            }
          }
          if ($checkedOutSha -cne $env:EVIDENCE_GITHUB_SHA) {
            throw "Checked-out SHA does not match github.sha. checked=$checkedOutSha github=$env:EVIDENCE_GITHUB_SHA"
          }
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:EVIDENCE_HEAD_SHA -cne $env:EVIDENCE_GITHUB_SHA) {
            throw "Main push evidence head SHA does not match github.sha."
          }
          $uiSummary = Join-Path $env:UI_ARTIFACT_DIR "ui-evidence-summary.txt"
          @(
            "GitHubSha=$env:EVIDENCE_GITHUB_SHA",
            "GitHubHeadSha=$env:EVIDENCE_HEAD_SHA",
            "CheckedOutSha=$checkedOutSha"
          ) | Add-Content -LiteralPath $uiSummary -Encoding UTF8

      - name: Summarize screenshots
        shell: pwsh
        run: |
          "## Windows native UI screenshots" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem $env:UI_ARTIFACT_DIR -Filter *.png | Sort-Object Name | ForEach-Object {
            "- $($_.Name) ($($_.Length) bytes)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "## Capture status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content (Join-Path $env:UI_ARTIFACT_DIR "capture-status.txt") | ForEach-Object {
            "- $_" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "## Native self-test" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content (Join-Path $env:UI_ARTIFACT_DIR "self-test.log") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "## UI performance gate" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content (Join-Path $env:UI_ARTIFACT_DIR "ui-perf-test.log") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "## Baseline policy" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- UI performance is judged against release/artifact-derived baselines, not ad hoc thresholds." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Missing screenshots, capture-status.txt, self-test.log, ui-perf-test.log, or window-info.txt invalidate the UI evidence." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Tab switching, compact tabs, resize sweep, DPI smoke, and splitter drag frames must be represented in capture-status.txt." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- capture-status.txt must include phase-1-ui-regression-closure before Phase 1 UI work is accepted." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Phase 1 closure also requires CTest, docs consistency, and current artifact-based self-test/perf evidence." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "## DPI / window metrics" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content (Join-Path $env:UI_ARTIFACT_DIR "window-info.txt") | ForEach-Object {
            "- $_" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "## Capture logs" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem $env:UI_ARTIFACT_DIR -File | Where-Object { $_.Extension -in ".log", ".txt" } | Sort-Object Name | ForEach-Object {
            "- $($_.Name) ($($_.Length) bytes)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "## UI artifact evidence files" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem $env:UI_ARTIFACT_DIR -File | Sort-Object Name | ForEach-Object {
            "- $($_.Name) ($($_.Length) bytes)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "## UI evidence summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content (Join-Path $env:UI_ARTIFACT_DIR "ui-evidence-summary.txt") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Assert native UI evidence completeness
        shell: pwsh
        run: |
          function Assert-RequiredEvidenceFile($Path, $Label) {
            if (!(Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "Native UI evidence file missing: $Label ($Path)"
            }
            $item = Get-Item -LiteralPath $Path
            if ($item.Length -le 0) {
              throw "Native UI evidence file is empty: $Label ($Path)"
            }
          }

          function Assert-FileContains($Path, $Needle, $Label) {
            $content = Get-Content -LiteralPath $Path -Raw
            if (!$content.Contains($Needle)) {
              Write-Host "===== $Label ====="
              Get-Content -LiteralPath $Path
              throw "Native UI evidence file missing required text '$Needle': $Label ($Path)"
            }
          }

          function Assert-FileHasExactLine($Path, $Expected, $Label) {
            $lines = @(Get-Content -LiteralPath $Path -Encoding UTF8)
            if ($lines -cnotcontains $Expected) {
              Write-Host "===== $Label ====="
              $lines | ForEach-Object { Write-Host $_ }
              throw "Native UI evidence file missing exact line '$Expected': $Label ($Path)"
            }
          }

          $requiredFiles = @(
            @{ Path = "$env:UI_ARTIFACT_DIR/root.png"; Label = "default screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/tab-single.png"; Label = "single tab screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/tab-quick.png"; Label = "quick tab screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/tab-file.png"; Label = "file tab screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/tab-scan.png"; Label = "scan tab screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/tab-settings.png"; Label = "settings tab screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/compact-tab-single.png"; Label = "compact single tab screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/compact-tab-quick.png"; Label = "compact quick tab screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/compact-tab-file.png"; Label = "compact file tab screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/compact-tab-scan.png"; Label = "compact scan tab screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/compact-tab-settings.png"; Label = "compact settings tab screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/dpi-100-window.png"; Label = "DPI 100 smoke screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/dpi-125-window.png"; Label = "DPI 125 smoke screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/log-splitter-before.png"; Label = "splitter before screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/log-splitter-frame-01.png"; Label = "splitter frame 01 screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/log-splitter-frame-02.png"; Label = "splitter frame 02 screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/log-splitter-after.png"; Label = "splitter after screenshot" },
            @{ Path = "$env:UI_ARTIFACT_DIR/capture-status.txt"; Label = "capture status" },
            @{ Path = "$env:UI_ARTIFACT_DIR/self-test.log"; Label = "native self-test log" },
            @{ Path = "$env:UI_ARTIFACT_DIR/ui-perf-test.log"; Label = "native UI performance log" },
            @{ Path = "$env:UI_ARTIFACT_DIR/window-info.txt"; Label = "window info" },
            @{ Path = "$env:UI_ARTIFACT_DIR/ui-evidence-summary.txt"; Label = "UI evidence summary" }
          )
          for ($index = 0; $index -lt 5; $index += 1) {
            $requiredFiles += @{ Path = "$env:UI_ARTIFACT_DIR/resize-$index.png"; Label = "resize sweep screenshot $index" }
          }
          foreach ($evidence in $requiredFiles) {
            Assert-RequiredEvidenceFile $evidence.Path $evidence.Label
          }

          $captureStatus = "$env:UI_ARTIFACT_DIR/capture-status.txt"
          $uiPerfLog = "$env:UI_ARTIFACT_DIR/ui-perf-test.log"
          $selfTestLog = "$env:UI_ARTIFACT_DIR/self-test.log"
          $windowInfo = "$env:UI_ARTIFACT_DIR/window-info.txt"
          $uiSummary = "$env:UI_ARTIFACT_DIR/ui-evidence-summary.txt"

          $requiredStatusTerms = @(
            "PASS default-window",
            "PASS tab-set",
            "PASS compact-tab-set",
            "PASS resize-sweep",
            "PASS dpi-smoke-100",
            "PASS dpi-smoke-125",
            "PASS splitter-drag-frames",
            "PASS phase-1-ui-regression-closure",
            "PASS capture-complete"
          )
          foreach ($term in $requiredStatusTerms) {
            Assert-FileContains $captureStatus $term "capture status"
          }
          $statusText = Get-Content -LiteralPath $captureStatus -Raw
          if ($statusText.Contains("FAIL ")) {
            Get-Content -LiteralPath $captureStatus
            throw "Native UI capture status contains FAIL."
          }
          Assert-FileContains $selfTestLog "ok" "native self-test log"
          Assert-FileContains $uiPerfLog "ui-perf ok" "native UI performance log"
          foreach ($metric in @("tabs=", "tab-ms=", "layout-pass=", "apply=", "revision=", "log-lines=", "log-ms=", "log-flush=", "log-rebuild=")) {
            Assert-FileContains $uiPerfLog $metric "native UI performance log"
          }
          Assert-FileContains $windowInfo "CapturedAt=" "window info"
          Assert-FileContains $windowInfo "ScalePercent=" "window info"
          Assert-FileContains $uiSummary "BaselinePolicy=release-artifact-derived" "UI evidence summary"
          Assert-FileContains $uiSummary "GateStatus=passed" "UI evidence summary"
          Assert-FileHasExactLine $uiSummary "GitHubSha=$env:EVIDENCE_GITHUB_SHA" "UI evidence summary"
          Assert-FileHasExactLine $uiSummary "GitHubHeadSha=$env:EVIDENCE_HEAD_SHA" "UI evidence summary"
          Assert-FileHasExactLine $uiSummary "CheckedOutSha=$env:EVIDENCE_GITHUB_SHA" "UI evidence summary"

      - name: Check docs artifact consistency
        shell: pwsh
        run: python scripts/check-docs-artifact-consistency.py

      - name: Upload UI screenshots
        id: upload-ui-screenshots
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-native-ui-screenshots
          path: |
            artifacts/windows-native-ui/*.png
            artifacts/windows-native-ui/capture-status.txt
            artifacts/windows-native-ui/self-test.log
            artifacts/windows-native-ui/ui-perf-test.log
            artifacts/windows-native-ui/window-info.txt
            artifacts/windows-native-ui/ui-evidence-summary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Report UI artifact upload
        if: always()
        shell: pwsh
        run: |
          "## UI artifact upload" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Artifact ID: ${{ steps.upload-ui-screenshots.outputs.artifact-id }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Artifact URL: ${{ steps.upload-ui-screenshots.outputs.artifact-url }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Artifact digest: ${{ steps.upload-ui-screenshots.outputs.artifact-digest }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "The UI artifact digest is CI upload evidence and does not replace screenshot/status review." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
