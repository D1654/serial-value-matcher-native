name: Windows Qt Portable Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  BUILD_DIR: build-windows
  QT_VERSION: 6.8.3
  QT_ARCH: win64_msvc2022_64
  PACKAGE_NAME: SerialValueMatcherNative-win-x64

jobs:
  build-test-package:
    name: Build, test, and package portable Windows app
    runs-on: windows-2022

    steps:
      - name: Check out repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Qt
        # jurplel/install-qt-action v4.3.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtserialport
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B $env:BUILD_DIR -G "Visual Studio 17 2022" -A x64 -DSVM_BUILD_QT_APP=ON -DSVM_BUILD_WIN32_APP=OFF

      - name: Build Release
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --parallel 1

      - name: Test Release
        shell: pwsh
        run: ctest --test-dir $env:BUILD_DIR --output-on-failure -C Release

      - name: Package portable zip
        shell: pwsh
        run: |
          $qtBinDir = Split-Path -Parent (Get-Command windeployqt.exe).Source
          & .\scripts\package-windows.ps1 `
            -BuildDir $env:BUILD_DIR `
            -Config Release `
            -QtBinDir $qtBinDir `
            -SkipBuild

      - name: Report package size
        shell: pwsh
        run: |
          $summaryPath = "artifacts/windows/$env:PACKAGE_NAME.package-summary.txt"
          Get-Content $summaryPath
          "## Windows Qt package size" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content $summaryPath | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload portable artifact
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            artifacts/windows/${{ env.PACKAGE_NAME }}.zip
            artifacts/windows/${{ env.PACKAGE_NAME }}.zip.sha256.txt
            artifacts/windows/${{ env.PACKAGE_NAME }}.package-summary.txt
          if-no-files-found: error
          retention-days: 14
