name: Linux Qt Stress

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            g++ \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-serialport-dev \
            libqt6sql6-sqlite

      - name: Configure stress tests
        run: cmake -S . -B build-stress -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSVM_ENABLE_STRESS_TESTS=ON

      - name: Build stress tests
        run: cmake --build build-stress --target quality_stress_tests --parallel 1

      - name: Run stress tests
        run: ctest --test-dir build-stress --output-on-failure -L stress
