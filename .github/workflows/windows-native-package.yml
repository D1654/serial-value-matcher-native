name: Windows Native Size-Gated Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  BUILD_DIR: build-windows-native
  PACKAGE_ARTIFACT_DIR: artifacts/windows-native
  PACKAGE_NAME: SerialValueMatcherNative-win32-native-x64

jobs:
  build-test-package:
    name: Build, self-test, and size-gate Win32 native app
    runs-on: windows-2022

    steps:
      - name: Check out repository
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Configure native-only
        shell: pwsh
        run: >
          cmake -S . -B $env:BUILD_DIR
          -G "Visual Studio 17 2022"
          -A x64
          -DSVM_BUILD_QT_APP=OFF
          -DSVM_BUILD_QT_TESTS=OFF
          -DSVM_BUILD_WIN32_APP=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --parallel 1

      - name: Run native tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:PACKAGE_ARTIFACT_DIR -Force | Out-Null
          $ctestLog = Join-Path $env:PACKAGE_ARTIFACT_DIR "native-ctest.log"
          $ctestOutput = & ctest --test-dir $env:BUILD_DIR --output-on-failure -C Release 2>&1
          $ctestExit = $LASTEXITCODE
          $ctestOutput | Tee-Object -FilePath $ctestLog
          if ($ctestExit -ne 0) {
            exit $ctestExit
          }

      - name: Report Phase 2 backend regression closure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:PACKAGE_ARTIFACT_DIR -Force | Out-Null
          $backendLog = Join-Path $env:PACKAGE_ARTIFACT_DIR "phase-2-backend-regression.txt"
          $backendLines = @(
            "Phase 2 backend regression closure",
            "Status: CI-blocking native CTest passed before packaging.",
            "Covered backend gates:",
            "- serial write queue contract and native serial state tests",
            "- Modbus core/executor/request/UI state tests",
            "- native storage replacement rollback and orphan-tail recovery tests",
            "- native package self-test and UI performance gates later in this workflow",
            "Local-only release-candidate evidence remains separate:",
            "- PTY normal/reopen/timeout/cancel/stress matrix is documented in serial-pty-matrix.txt"
          )
          $backendLines | Set-Content -Path $backendLog -Encoding UTF8
          "## Phase 2 backend regression closure" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $backendLines | ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }

      - name: Report native serial PTY matrix gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:PACKAGE_ARTIFACT_DIR -Force | Out-Null
          $ptyLog = Join-Path $env:PACKAGE_ARTIFACT_DIR "serial-pty-matrix.txt"
          $ptyLines = @(
            "Native serial PTY matrix",
            "Status: local-only release-candidate evidence",
            "CI blocking in this workflow: no PTY scenario is executed on the Windows runner.",
            "CI blocking evidence file: yes, this status note must exist and upload with the package artifact.",
            "Reason: windows-2022 does not expose POSIX PTYs or Wine dosdevices for the Linux/Wine loopback harness.",
            "CI-blocking serial-related gates today:",
            "- CTest native serial unit tests and native loopback skip/safety path",
            "- svm-native-win32.exe --self-test",
            "- svm-native-win32.exe --ui-perf-test",
            "- package audit and docs consistency",
            "Local release-candidate command:",
            "SVM_SERIAL_LOOPBACK_SCENARIOS=normal,reopen,timeout,cancel,stress python3 scripts/run-windows-native-serial-pty-loopback.py",
            "Expected local scenarios: normal, reopen, timeout, cancel, stress."
          )
          $ptyLines | Set-Content -Path $ptyLog -Encoding UTF8
          "## Native serial gate boundaries" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Gate | CI blocking? | Evidence |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| --- | --- | --- |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Native CTest serial/unit gates | Yes | ctest --test-dir build-windows-native --output-on-failure -C Release |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| App self-test and UI performance | Yes | native-self-test.log, native-ui-perf-test.log |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Package audit and docs consistency | Yes | package summary, docs consistency step |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| PTY normal/reopen/timeout/cancel/stress matrix | No, local-only RC evidence | serial-pty-matrix.txt records why CI does not execute it |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "PTY note file: $ptyLog" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Run locally from a Linux/Wine environment before release candidates that touch serial I/O:" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````bash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $ptyLines[11] | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Run native app self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:PACKAGE_ARTIFACT_DIR -Force | Out-Null
          $env:SVM_NATIVE_SELF_TEST_LOG = Join-Path $env:PACKAGE_ARTIFACT_DIR "native-self-test.log"
          & (Join-Path $env:BUILD_DIR "Release\svm-native-win32.exe") --self-test

      - name: Run native UI performance gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:PACKAGE_ARTIFACT_DIR -Force | Out-Null
          $env:SVM_NATIVE_SELF_TEST_LOG = Join-Path $env:PACKAGE_ARTIFACT_DIR "native-ui-perf-test.log"
          & (Join-Path $env:BUILD_DIR "Release\svm-native-win32.exe") --ui-perf-test

      - name: Package native zip
        shell: pwsh
        run: >
          .\scripts\package-windows-native.ps1
          -BuildDir $env:BUILD_DIR
          -Config Release
          -PackageDir $env:PACKAGE_ARTIFACT_DIR
          -SkipBuild
          -SkipSelfTest
          -SkipUiPerfTest

      - name: Assert native package audit
        shell: pwsh
        run: |
          $zipPath = "$env:PACKAGE_ARTIFACT_DIR/$env:PACKAGE_NAME.zip"
          $hashPath = "$zipPath.sha256.txt"
          $summaryPath = "$env:PACKAGE_ARTIFACT_DIR/$env:PACKAGE_NAME.package-summary.txt"
          foreach ($path in @($zipPath, $hashPath, $summaryPath)) {
            if (!(Test-Path $path)) {
              throw "Native package audit artifact missing: $path"
            }
          }
          $summary = Get-Content $summaryPath -Raw
          if ($summary -notmatch "Gate status: passed") {
            Get-Content $summaryPath
            throw "Native package audit did not pass."
          }

      - name: Check docs artifact consistency
        shell: pwsh
        run: python scripts/check-docs-artifact-consistency.py

      - name: Report native package size
        shell: pwsh
        run: |
          $summaryPath = "$env:PACKAGE_ARTIFACT_DIR/$env:PACKAGE_NAME.package-summary.txt"
          Get-Content $summaryPath
          "## Windows native package size" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content $summaryPath | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "## Native package evidence files" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem $env:PACKAGE_ARTIFACT_DIR -File | Sort-Object Name | ForEach-Object {
            "- $($_.Name) ($($_.Length) bytes)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload native artifact
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            artifacts/windows-native/${{ env.PACKAGE_NAME }}.zip
            artifacts/windows-native/${{ env.PACKAGE_NAME }}.zip.sha256.txt
            artifacts/windows-native/${{ env.PACKAGE_NAME }}.package-summary.txt
            artifacts/windows-native/native-ctest.log
            artifacts/windows-native/native-self-test.log
            artifacts/windows-native/native-ui-perf-test.log
            artifacts/windows-native/phase-2-backend-regression.txt
            artifacts/windows-native/serial-pty-matrix.txt
          if-no-files-found: error
          retention-days: 14
